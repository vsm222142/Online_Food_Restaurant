  <title>Foodfun Website | Booking Table</title>
  <style>
    .booking_slide {
      width: 100%;
      height: 110vh;
      background-image: url('Image/Book_table_img.jpg');
      background-repeat: no-repeat;
      background-size: cover;
      display: flex;
      justify-content: center;
      padding: 70px 0px;

    }

    .book {
      width: 40%;
      height: 98vh;
      background-color: aliceblue;
      display: flex;
      justify-content: center;
      border-radius: 10px;

    }

    .book form {
      display: flex;
      width: 100%;

      flex-direction: column;
      padding: 50px 30px;

    }

    .book form h2 {
      margin-bottom: 15px;
      color: rgb(250, 120, 60);
      font-weight: bold;
    }

    .book form input {
      padding: 5px;
      margin-bottom: 15px;
    }

    .btn {
      display: flex;
      flex-direction: column;
      padding: 10px;

    }

    .btn a input {
      background-color: rgb(237, 121, 68);
      color: white;
      width: 100%;
      font-weight: bold;
      border-radius: 5px;

    }

    .btn a input:hover {
      background-color: white;
      color: black;
      transition: all 2s;
    }


    /*  Responsive Design  */

    /* For Tables View  */

    @media (max-width: 992px) {
      .book {
        width: 60%;
      }
    }

    @media (max-width: 768px) {
      .booking_slide {
        padding: 50px 0;
      }

      .book {
        width: 70%;
        height: 60%;

      }

      .book form {
        padding: 30px 20px;
      }

      .book form h2 {
        font-size: 22px;
      }

      .book form input {
        font-size: 14px;
        padding: 8px;
      }

      .btn {
        padding: 5px;
      }
    }

    /*  For Mobile View */
    @media (max-width: 576px) {
      .book {
        width: 80%;
        height: 85%;
        box-shadow: none;
        border-radius: 5px;
      }

      .book form h2 {
        font-size: 20px;
        text-align: center;


        .book form label {
          font-size: 14px;
        }

        .book form input {
          font-size: 13px;
          padding: 6px;
        }

        .btn a input {
          font-size: 14px;
          padding: 8px;
        }
      }
    }
  </style>
</head>
